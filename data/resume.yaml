featured:
  - name: GeoNote
    label: Location-Based Reminder App
    tagline: Reminders for where life happens.
    started: Aug 2025
    status: Functional pre-launch MVP
    description: >
      An independent product I designed and built end to end. Users attach a reminder to a
      place and get a notification when they arrive nearby. The Django REST API and the product
      website are deployed, and signed Android builds were validated on physical devices,
      including alerts after the app was closed and after a reboot. The app is not yet publicly
      released on app stores, and iOS is not supported yet.
    highlights:
      - Native Android geofencing with background notifications that do not depend on a running Flutter process, with cooldown and re-entry rules against duplicate alerts.
      - Geospatial data with PostgreSQL and PostGIS, including location-based discovery of nearby public reminders.
      - Django REST Framework API with a versioned mobile contract (/api/v1/) so backend deploys stay compatible with installed app versions.
      - Passwordless sign-in with email one-time codes and JWT sessions.
      - Privacy controls, reminder sharing (private, unlisted or public) and moderation with audit history.
      - CI/CD with GitHub Actions, automated tests, a signed Android release workflow, structured logs and request correlation.
    stack: [Flutter, Dart, Python, Django REST Framework, PostgreSQL, PostGIS, REST APIs, GitHub Actions]
    links:
      - label: View Product
        url: https://geonote.net/
      - label: Engineering Overview
        url: https://github.com/rrafaelpinto/geonote-product

