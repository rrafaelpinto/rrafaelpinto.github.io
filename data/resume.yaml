cases:
  - slug: hermes
    title: Hermes, NLP for public health evaluation
    period: 2018 to 2023
    stack: [Python, Scrapy, Pandas, NLTK, VADER, TF-IDF, DBSCAN]
    problem: >
      Health authorities needed evidence on whether national campaigns against syphilis
      changed media coverage and health outcomes, using large amounts of unstructured news.
    approach: >
      I built a modular pipeline to collect, clean and process online news. I adapted VADER
      sentiment analysis to Brazilian Portuguese, clustered articles with TF-IDF and DBSCAN,
      and used Interrupted Time Series with segmented regression on congenital syphilis rates.
    result: >
      The platform supported the evaluation of the "Syphilis No!" project, linking campaign
      periods to changes in news coverage and in health indicators.

  - slug: telehealth
    title: Large-scale telehealth platform
    period: 2023 to 2025
    stack: [Python, Django, PostgreSQL, GitLab CI/CD]
    problem: >
      A public telehealth platform had to grow in features and users while integrating with
      health data pipelines and serving many stakeholders.
    approach: >
      As technical lead and project manager, I owned the backend architecture and API
      integrations, ran sprints and code reviews, and set up CI/CD and performance monitoring.
    result: >
      Continuous delivery with traceable releases, and requirements from health specialists
      turned into small, well-scoped engineering tasks.

  - slug: suap-uft
    title: Deploying SUAP at a federal university
    period: 2024 to 2026
    stack: [Python, Django, PostgreSQL]
    problem: >
      The Federal University of Tocantins (UFT) needed to adopt SUAP, the management system
      developed at IFRN, under a formal cooperation agreement with fixed goals and deadlines.
    approach: >
      I coordinated the project end to end: technical planning, deployment, knowledge
      transfer to the local team and reporting to both institutions.
    result: >
      All 6 project goals were completed and the final technical report was delivered.

